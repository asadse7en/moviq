name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $projectVersion = python -c "from moviq import __version__; print(__version__)"
          if ($version -ne $projectVersion) {
              throw "Tag '$tag' does not match moviq.__version__ ('$projectVersion')."
          }

      - name: Install build dependencies
        run: pip install -r packaging/requirements-build.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          $iscc = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $iscc) {
              choco install innosetup -y
          }

      - name: Build release artifacts
        shell: pwsh
        run: powershell -File packaging/build.ps1

      - name: Publish the release artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/dist/v${{ github.ref_name }}/*
