name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: ubuntu-22.04
            arch: x64
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Read project version
        shell: bash
        if: runner.os != 'Windows'
        run: |
          version="$(python -c "from moviq import __version__; print(__version__)")"
          echo "MOVIQ_VERSION=$version" >> "$GITHUB_ENV"

      - name: Read project version
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          $version = python -c "from moviq import __version__; print(__version__)"
          "MOVIQ_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify tag matches project version
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $projectVersion = python -c "from moviq import __version__; print(__version__)"
          if ($version -ne $projectVersion) {
              throw "Tag '$tag' does not match moviq.__version__ ('$projectVersion')."
          }

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install -r packaging/requirements-build.txt

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y python3-tk libfuse2 desktop-file-utils

      - name: Run unit tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m unittest discover -s tests

      - name: Build release artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -File packaging/build.ps1

      - name: Build release artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash packaging/build.sh linux

      - name: Build release artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash packaging/build.sh macos

      - name: Upload Windows setup artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: moviq-build-${{ matrix.runner }}-setup
          path: release/dist/v${{ env.MOVIQ_VERSION }}/Moviq-${{ env.MOVIQ_VERSION }}-windows-x64-setup.exe
          archive: false
          if-no-files-found: error

      - name: Upload Windows portable artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: moviq-build-${{ matrix.runner }}-portable
          path: release/dist/v${{ env.MOVIQ_VERSION }}/Moviq-${{ env.MOVIQ_VERSION }}-windows-x64-portable.zip
          archive: false
          if-no-files-found: error

      - name: Upload Linux AppImage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: moviq-build-${{ matrix.runner }}-appimage
          path: release/dist/v${{ env.MOVIQ_VERSION }}/Moviq-${{ env.MOVIQ_VERSION }}-linux-x64.AppImage
          archive: false
          if-no-files-found: error

      - name: Upload Linux tar artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: moviq-build-${{ matrix.runner }}-tar
          path: release/dist/v${{ env.MOVIQ_VERSION }}/Moviq-${{ env.MOVIQ_VERSION }}-linux-x64.tar.gz
          archive: false
          if-no-files-found: error

      - name: Upload macOS dmg artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: moviq-build-${{ matrix.runner }}-dmg
          path: release/dist/v${{ env.MOVIQ_VERSION }}/Moviq-${{ env.MOVIQ_VERSION }}-macos-${{ matrix.arch }}.dmg
          archive: false
          if-no-files-found: error

  checksums:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true
          skip-decompress: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v7
        with:
          name: moviq-checksums
          path: release-artifacts/SHA256SUMS.txt
          archive: false
          if-no-files-found: error

  publish:
    needs: checksums
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-upload
          merge-multiple: true
          skip-decompress: true

      - name: Verify tag matches project version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          project_version="$(python -c "from moviq import __version__; print(__version__)")"
          if [ "$version" != "$project_version" ]; then
            echo "Tag '$tag' does not match moviq.__version__ ('$project_version')."
            exit 1
          fi

      - name: Publish the release artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-upload/*
