[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moviq"
dynamic = ["version"]
description = "A desktop app for matching and organizing movie files with TMDB"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "customtkinter>=5.2.2",
    "Pillow>=10",
    "requests>=2.31",
    "resvg-py>=0.5.0",
]

[project.optional-dependencies]
gui = [
    "sv-ttk>=2.6",
    "tkinterdnd2>=0.4",
]
build = [
    "pyinstaller>=6",
]
[project.gui-scripts]
moviq = "moviq.__main__:main"

[tool.setuptools.packages.find]
include = ["moviq*"]

[tool.setuptools.dynamic]
version = {attr = "moviq.__version__"}

[tool.setuptools.package-data]
moviq = ["ui/assets/tmdb-logo.png"]
